# 게임 페이지(/games) 내용. 웹에서만 보이고 PDF에는 들어가지 않는다.
# 개인 활동이라 공식 대회 · 행사를 모은 Activities와 따로 둔다. 문장 규칙은 Activities와 같다.

# 첫 화면. 오디세이보다 gamedev-kit과 AI로 게임을 만든다는 것을 앞에 둔다 (본인 요청, 2026-10-21).
hero:
  kicker: GAMEDEV-KIT × AI
  # 줄마다 끊어 보여 준다 ('AI를 활용해,' 뒤에서 줄을 바꾼다 — 본인 요청).
  sub: [ "직접 만든 Claude Code 플러그인 gamedev-kit과 AI를 활용해,", 기획부터 출시까지 혼자 게임을 만듭니다. ]

# 페이지에서 가장 앞에 크게 두는 플러그인 (본인 요청). 상세 페이지는 두지 않고 소개 사이트로 바로 간다.
gamedevKit:
  title: gamedev-kit
  kicker: Claude Code 플러그인
  period: 2026.10 - 진행 중
  role: 1인 개발 · 워크플로우 설계 · AI 디렉팅(구현)
  links:
    - label: 소개 사이트
      href: https://gamedev-kit-site.vercel.app/ko
    - label: GitHub
      href: https://github.com/dudwns0921/claude-gamedev-kit
    - label: Threads
      href: https://www.threads.com/@glowingjung/post/DeRzUkfGjII?hl=ko
  # 플러그인 README의 한 줄 소개(2026-10-21 갱신)를 따른다.
  description: 에이전트가 게임을 한 사이클씩 만들고 여러 사이클을 뒤에서 동시에 돌려, 나는 대시보드에서 결정하고 플레이만 하는 Claude Code 플러그인.
  techStack: [ Claude Code, Python, Godot, Unity, Web ]
  # 수치 · 에이전트 · 스킬 대신 사이클이 도는 모습만 보여 준다 (본인 요청, 2026-10-21 — 자세한 것은 소개 사이트에 있다).
  # 고리의 여섯 단계. byUser는 내가 하는 단계이고, line은 빛 구슬이 지날 때 옆 목록에서 켜지는 설명이다 (플러그인 README의 배너 기준: Goal · Spec · Design · Plan · Build · Play).
  cycle:
    - name: 목표
      byUser: true
      line: 이번에 무엇을 만들지 내가 정해서 말한다.
    - name: 기획
      line: 플레이어가 무엇을 하면 어떻게 되는지를 규칙과 숫자로 쓴다.
    - name: 디자인
      line: 그 규칙이 게임에서 어떻게 보이고 들릴지를 정리한다.
    - name: 계획
      line: 앞에서 쓴 내용을 작업 여러 개로 나누고 만들 순서를 짠다.
    - name: 구현
      line: 겹치지 않는 작업은 여러 AI가 하나씩 맡아 동시에 만든다.
    - name: 플레이
      byUser: true
      line: 만들어진 빌드를 내가 직접 해 보고, 찾은 문제는 원인부터 고친다.
  # CEO (플러그인 0.85.0, README의 'Several cycles at once' 절): 고리에는 흐린 빛 구슬 둘이 더 돌아 동시에 도는 사이클을 보여 준다.
  ceo: CEO 창이 다음 목표를 제안하고 사이클마다 일꾼을 띄워, 여러 사이클이 뒤에서 동시에 돈다. 일꾼은 내가 결정하거나 플레이할 곳에서만 멈추고, CEO는 아무것도 대신 정하지 않는다.

# 세 게임을 묶는 머리. 역할 · 기술 스택은 세 게임에 공통이다.
trilogy:
  title: 오디세이 3부작
  period: 2026.09 - 2026.10
  role: 1인 개발 · 기획 · AI 디렉팅(구현·3D 에셋·사운드·영상)
  description: 호메로스 『오디세이아』의 세 에피소드를 하나씩 게임으로 옮긴 3부작. 기획부터 출시까지 1인으로 진행해 모두 itch.io에 출시.
  techStack: [ Godot 4.7, GDScript, Claude Code, gamedev-kit, Meshy AI, ElevenLabs, Blender, Higgsfield, ChatGPT ]

# 최신순
games:
  - slug: nostos
    title: Nostos
    period: "2026.10"
    # gamedev-kit으로 만든 게임은 사이클을 몇 번 돌렸는지 적는다. 플러그인으로 만들지 않은 Outis는 비운다.
    kitCycles: 18
    genre: 1인칭 활 싸움
    # 그림 파일은 content/games/<slug>/banner.jpg에 있고, 빌드 때 이 주소로 복사된다.
    banner: /activities/nostos/banner.jpg
    # 카드 테두리와 빛의 색. 배너 그림의 색을 따른다.
    accent: "#ffd24a"
    links:
      - label: itch.io에서 플레이
        href: https://dudwns0921.itch.io/nostos
    description: 스무 해 만에 집에 돌아온 오디세우스가 되어, 잔치를 벌이는 구혼자들을 오직 활 하나로 쓰러뜨리는 1인칭 3D 활 싸움. 21~22권의 활 시합과 구혼자 처단 에피소드를 바탕으로 제작.
    achievements:
      - description: 시그니처 동작인 시위 걸기를 장전과 연결한 기획 — 원전의 활 시합처럼 시위를 걸며 판을 열고, 4발마다 시위가 끊어져 다시 걸게 해 한 동작이 싸움 내내 긴장의 리듬으로 되풀이되도록 설계
  - slug: keros
    title: Keros
    period: "2026.10"
    kitCycles: 8
    genre: 3인칭 3D 디펜스
    banner: /activities/keros/banner.jpg
    accent: "#8ad8ff"
    links:
      - label: itch.io에서 플레이
        href: https://dudwns0921.itch.io/keros
    description: 세이렌의 바다를 지나는 오디세우스의 배에서 부관이 되어, 홀린 선원을 붙잡아 이타카까지 버티는 3인칭 3D 디펜스. 세이렌 에피소드를 바탕으로 제작.
    achievements:
      - description: 세이렌에 홀린 선원을 붙잡는 행동 하나에서 출발한 기획 — 플레이어를 오디세우스가 아닌 부관으로 두고, 노 젓기와 무기 조준을 빼 선원을 지키는 일에만 집중
  - slug: outis
    title: Outis
    period: "2026.09"
    genre: 3인칭 3D 어드벤처
    banner: /activities/outis/banner.jpg
    accent: "#ff9a5a"
    links:
      - label: itch.io에서 플레이
        href: https://dudwns0921.itch.io/outis
    description: 외눈박이 거인의 동굴에 갇힌 오디세우스가 잠든 거인 곁을 몰래 오가며 무기를 만들고 선원들과 탈출하는 3인칭 3D 어드벤처. 키클롭스 에피소드를 바탕으로 제작.
    achievements:
      - description: 거인의 눈을 말뚝으로 찌르는 행동 하나에서 출발한 기획 — 말뚝을 잘라 다듬고 달궈 찌르기까지의 준비를, 잠든 거인 곁에서 들키지 않고 해내는 구조로 확장
      - description: "**기획서(GDD)와 코드를 양방향으로 맞추는 동기화 스킬 설계** — 수치·규칙·입력·HUD 항목에 ID를 붙여, 어느 한쪽을 바꿔도 다른 쪽에 곧바로 반영되는 구조 확보"
      - description: "**밸런스 수치를 엑셀 표로 관리하는 스킬 설계** — 수치 111개를 표 하나로 빼, 저장하면 실행 중인 게임에 즉시 반영되어 게임을 끄지 않고 값을 바꿔 가며 조정하는 구조 구축"
