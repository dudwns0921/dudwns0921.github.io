# 제목 세 줄. 줄바꿈 · 화면 폭에 따른 배치는 테마가 정한다.
greeting:
  - 안녕하세요,
  - 믿고 맡길 수 있는
  - 정영준입니다

paragraphs:
  # 1. 정체성과 태도 (회사). 강조는 인사평가 결과 하나.
  - 모빌리티 도메인에서 차량용 웹 서비스를 만들어 온 5년차 프론트엔드 개발자입니다. 누군가는 해야 하는 일에 먼저 나서고, 맡은 일은 끝까지 책임지는 태도로 입사 후 **4년 연속 전사 상위 2% 인사평가 최고 등급**을 받았습니다.
  # 2. 회사에서의 AI 활용. 강조는 주제 구절 하나 ('코드를 짜는 일을 넘어,'는 강조 밖).
  - 코드를 짜는 일을 넘어, **일하는 모든 과정에 AI를 깊이 녹여 냅니다**. 프로젝트 규격을 Claude Code 스킬로 옮기던 방식을 발전시켜, 도메인 문서를 쌓고 그 문서를 읽으며 플랜·구현·확인을 진행하는 Claude Code 플러그인을 설계했습니다. JIRA 워크로그를 분석해 근무일지를 자동으로 쓰는 솔루션으로 사내 AI 챌린지 1위와 전사 도입을 이끌었습니다. 아침 JIRA 브리핑, 메일 초안 검수, 학습 기록 정리처럼 매일 하는 일도 AI로 자동화해 일상 업무 흐름에 자연스럽게 자리 잡게 했습니다.
  # 3. 해커톤. 강조는 첫 문장 전체와 수상.
  - "**해커톤에 적극 참가하며 AI 역량을 쌓아 갑니다**. NAN 2026 Game X AI 해커톤에서는 지원 588팀 중 본선 10팀에 올라 **3위로 우수상**을 받았고, CODEGATE 2026 AI 스타트업 해커톤 본선 진출 아이디어로는 사내 특허 출원을 진행하고 있습니다. Push to Prod SEOUL 해커톤 본선에는 팀장으로 나갔습니다."
  # 4. 게임 제작. 강조는 첫 문장 전체. 끝의 링크는 게임 이야기를 읽다가 바로 게임 페이지로 넘어가는 길이다 (PDF에도 남긴다).
  - "**게임을 즐겨 만들며 AI 역량을 심화합니다**. 1인 개발한 오디세이 3부작 「Outis」 · 「Keros」 · 「Nostos」를 itch.io에 출시했고, 나만의 워크플로우를 Claude Code 플러그인으로 구현해 게임을 제작하고 있습니다. [만든 게임 보러 가기 →](/games)"
