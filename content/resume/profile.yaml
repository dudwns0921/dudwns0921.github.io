# 소개글. 문단마다 역할이 하나씩 있다 (CLAUDE.md '소개글' 절). 회사 일과 해커톤 · 게임 제작은 문단을 나눈다.
# '**구절**'은 노란 강조, '[글자](주소)'는 링크다. '/'로 시작하는 주소는 PDF에서 운영 주소 전체로 바뀐다.

# 제목 세 줄. 줄바꿈 · 화면 폭에 따른 배치는 테마가 정한다.
greeting:
  - 안녕하세요,
  - 믿고 맡길 수 있는
  - 정영준입니다

paragraphs:
  # 1. 정체성과 태도 (회사). 강조는 인사평가 결과 하나.
  - 모빌리티 도메인에서 차량용 웹 · 앱을 만들어 온 5년차 개발자입니다. 누군가는 해야 하는 일에 먼저 나서고 끝까지 책임져, 입사 후 **4년 연속 전사 상위 2% 인사평가 최고 등급**을 받았습니다.
  # 2. 회사에서의 AI 활용. 강조는 주제 구절 하나 ('코드를 짜는 일을 넘어,'는 강조 밖).
  - 코드를 짜는 일을 넘어, **일하는 모든 과정에 AI를 깊이 녹여 냅니다**. 메인 에이전트가 판단을 맡고 하위 에이전트들이 실무를 나눠 처리하는 업무용 플러그인을 만들어 쓰고 있습니다. 팀에는 작업 방식은 각자에게 맡기고 프로젝트 지식을 쌓는 방식만 통일한 지식 플러그인을 배포해, 어느 프로젝트에 가도 익숙한 지식 체계 위에서 빠르게 적응할 수 있게 했습니다. JIRA 워크로그로 근무일지를 자동으로 쓰는 솔루션으로는 사내 AI 챌린지 1위와 전사 도입을 이끌었습니다.
  # 3. 해커톤. 강조는 첫 문장 전체와 수상.
  - "**해커톤에 적극 참가하며 AI 역량을 쌓아 갑니다**. NAN 2026 Game X AI 해커톤에서는 588팀 중 본선 10팀에 올라 **3위로 우수상**을 받았고, CODEGATE 2026 AI 스타트업 해커톤(본선 아이디어로 사내 특허 출원 진행 중)과 Push to Prod SEOUL 해커톤(팀장)에서 본선에 올랐습니다."
  # 4. 만들기. 강조는 첫 문장 전체. 게임에 묶지 않고 다양한 것을 만들며 AI 역량을 심화한다는 주제 (본인 요청, 2026-11-11).
  - "**다양한 것을 즐겨 만들며 AI 역량을 심화합니다**. 오디세이 3부작 「Outis」 · 「Keros」 · 「Nostos」를 1인 개발해 itch.io에 출시했고, 게임 제작 플러그인 [claude-gamedev-kit](https://github.com/dudwns0921/claude-gamedev-kit)을 만들어 공개해 스레드에서 7,600회 조회를 받았습니다. OpenClaw로 개인 AI 에이전트를 직접 구성해 사용하고 있습니다."
