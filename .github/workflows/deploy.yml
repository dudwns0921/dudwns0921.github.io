name: resume deployment

# master에 푸시하면 정적 사이트(이력서 · /games · /blog)와 PDF를 만들어 GitHub Pages에 올린다.
# 이 저장소(dudwns0921.github.io)에 연결한 도메인 루트 https://elioground.com 으로 열린다.
# 순서: 설치 → 타입 검사 → 테스트 → 빌드 → Chrome 설치 → PDF → 빌드 결과 검사 → 업로드
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # content/의 스키마 오류는 빌드에서도 멈추지만, 타입과 테스트를 먼저 본다.
      - name: Type check
        run: pnpm check

      - name: Test
        run: pnpm test

      - name: Build static site
        run: pnpm build

      # 패키지 설치가 캐시에서 복원되면 puppeteer의 Chrome 내려받기가 건너뛰어지므로 따로 설치한다.
      - name: Install Chrome for PDF
        run: pnpm exec puppeteer browsers install chrome

      - name: Generate resume PDF
        run: pnpm pdf

      # 옛 블로그 주소 107개 · 초안 흔적 · 내부 링크 · 핵심 파일 (resume.pdf가 있어야 하므로 PDF 다음)
      - name: Check built site
        run: pnpm check:site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
