name: resume deployment

# master에 푸시하면 정적 사이트와 PDF를 만들어 GitHub Pages에 올린다.
# 이 저장소(dudwns0921.github.io)에 연결한 도메인 루트 https://elioground.com 으로 열린다.
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build static site
        run: pnpm build

      # 패키지 설치가 캐시에서 복원되면 puppeteer의 Chrome 내려받기가 건너뛰어지므로 따로 설치한다.
      - name: Install Chrome for PDF
        run: pnpm exec puppeteer browsers install chrome

      - name: Generate resume PDF
        run: pnpm pdf

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
